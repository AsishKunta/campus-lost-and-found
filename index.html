  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await window.apiFetch(`${window.BASE_URL}/auth/me`);
        window.location.replace(response.ok ? "dashboard.html" : "login.html");
      } catch (_) {
        window.location.replace("login.html");
      }
    });
