<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Campus Lost & Found password.">
  <title>Reset Password | Campus Lost & Found</title>
  <link rel="icon" type="image/png" href="assets/profile.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="css/auth.css">
  <script>
    if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
      document.write('<script src="/api/runtime-config.js"><\\/script>');
    }
  </script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-introduction" aria-labelledby="resetProductTitle">
      <a class="auth-brand" href="login.html" aria-label="Campus Lost and Found sign in">
        <span class="auth-brand-mark" aria-hidden="true">LF</span>
        <span>Campus Recovery</span>
      </a>
      <div class="auth-introduction-copy">
        <p class="auth-eyebrow">Secure account recovery</p>
        <h1 id="resetProductTitle">Choose a new password.</h1>
        <p>Your reset link is time-limited and works only once.</p>
      </div>
    </section>
    <section class="auth-panel" aria-labelledby="resetTitle">
      <div class="auth-card">
        <div class="auth-heading">
          <p class="auth-eyebrow">Password recovery</p>
          <h2 id="resetTitle">Reset Password</h2>
          <p>Enter and confirm your new password.</p>
        </div>
        <form id="resetPasswordForm" class="auth-form" novalidate>
          <div class="auth-field">
            <label for="newPassword">New Password</label>
            <div class="password-control">
              <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
              <button type="button" class="password-toggle" data-password-target="newPassword" aria-label="Show new password">Show</button>
            </div>
          </div>
          <div class="auth-field">
            <label for="confirmNewPassword">Confirm New Password</label>
            <div class="password-control">
              <input type="password" id="confirmNewPassword" autocomplete="new-password" minlength="8" required>
              <button type="button" class="password-toggle" data-password-target="confirmNewPassword" aria-label="Show password confirmation">Show</button>
            </div>
          </div>
          <button type="submit" class="auth-submit">Reset Password</button>
          <a class="auth-text-action" href="login.html">Back to Sign In</a>
        </form>
        <div id="resetFeedback" class="auth-feedback hidden" role="status" aria-live="polite" tabindex="-1"></div>
      </div>
    </section>
  </main>
  <script src="./js/common.js?v=4"></script>
  <script src="./js/reset-password.js"></script>
</body>
</html>
